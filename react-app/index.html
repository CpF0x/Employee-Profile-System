<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React + TypeScript + Tailwind</title>

    <!-- 强制性样式块，不允许闪烁 -->
    <style id="anti-flash">
      /* 完全隐藏页面并设置背景色 - 使用opacity而不是visibility以避免闪烁 */
      html:not(.theme-ready) {
        opacity: 0 !important;
      }

      /* 确保没有内容可见，直到正确的主题应用 */
      #root {
        opacity: 0 !important;
      }

      /* 当正确主题应用后，应用这个类来显示内容 */
      html.theme-ready {
        opacity: 1 !important;
      }

      html.theme-ready #root {
        opacity: 1 !important;
        transition: opacity 0.2s ease-in;
      }

      /* 明确预设主题变量 - 在HTML元素上设置背景色，而不是body */
      html.dark {
        background-color: #0f172a !important;
        color: #ffffff !important;
      }

      html.light {
        background-color: #f1f5f9 !important;
        color: #1e293b !important;
      }
    </style>

    <!-- 尽早执行的脚本，阻塞任何渲染，确保主题正确设置 -->
    <script>
      // 立即执行
      (function() {
        // 存储当前主题，供其他脚本使用
        window.__THEME_INITIALIZED__ = false;

        try {
          // 获取主题偏好
          const storedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = storedTheme || (prefersDark ? 'dark' : 'light');

          // 立即应用主题到HTML元素 - 使用类名而不是data属性，以支持Tailwind暗色模式
          document.documentElement.classList.add(theme);
          document.documentElement.classList.remove(theme === 'dark' ? 'light' : 'dark');

          // 将主题存储到localStorage
          if (theme !== storedTheme) {
            localStorage.setItem('theme', theme);
          }

          // 标记主题已初始化
          window.__THEME_INITIALIZED__ = true;
          window.__CURRENT_THEME__ = theme;
        } catch (e) {
          console.error('主题初始化失败:', e);
          // 确保页面至少可见
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
          window.__THEME_INITIALIZED__ = true;
          window.__CURRENT_THEME__ = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- 最终解决方案：在所有资源加载完成后再显示内容 -->
    <script>
      (function() {
        // 检查页面加载完成
        function showPage() {
          // 确保主题已正确应用
          const isDark = document.documentElement.classList.contains('dark');
          const currentTheme = isDark ? 'dark' : 'light';

          if (window.__CURRENT_THEME__ && currentTheme !== window.__CURRENT_THEME__) {
            if (window.__CURRENT_THEME__ === 'dark') {
              document.documentElement.classList.add('dark');
              document.documentElement.classList.remove('light');
            } else {
              document.documentElement.classList.add('light');
              document.documentElement.classList.remove('dark');
            }
          }

          // 使页面可见 - 延迟一点以确保主题已完全应用
          setTimeout(function() {
            // 禁用初始防闪烁样式
            document.getElementById('anti-flash').disabled = true;

            // 使页面可见
            document.documentElement.classList.add('theme-ready');
          }, 50);
        }

        // 在DOM内容和所有资源加载完成后执行
        if (document.readyState === 'complete') {
          showPage();
        } else {
          window.addEventListener('load', showPage);
        }

        // 监听页面导航事件，确保主题在页面导航时保持一致
        window.addEventListener('beforeunload', function() {
          // 在页面卸载前保存当前主题状态
          const isDark = document.documentElement.classList.contains('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
      })();
    </script>
  </body>
</html>
