<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Login</title>
    <link rel="stylesheet" href="portal.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #particles-js {
            background-color: #0f172a !important; /* 深蓝色背景 */
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 420px;
            padding: 40px 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            padding: 45px 35px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .login-logo {
            font-size: 28px;
            margin-bottom: 20px;
            color: white;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            width: 60px;
            height: 60px;
            line-height: 60px;
            border-radius: 50%;
            margin: 0 auto 25px;
            transition: transform 0.5s ease;
        }

        .login-logo:hover {
            transform: rotate(360deg);
        }

        .login-header {
            margin-bottom: 35px;
        }

        .login-header h1 {
            color: white;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #e0f2fe, #bfdbfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .form-group {
            position: relative;
            margin-bottom: 28px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s;
            letter-spacing: 0.2px;
        }

        .form-group input {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: rgba(129, 140, 248, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
        }

        .remember-me input {
            margin-right: 10px;
            accent-color: #818cf8;
            height: 18px;
            width: 18px;
        }

        .remember-me label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
        }

        .forgot-password {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            text-decoration: none;
            transition: color 0.3s ease;
            position: relative;
        }

        .forgot-password::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 0;
            background: #818cf8;
            transition: width 0.3s ease;
        }

        .forgot-password:hover {
            color: #818cf8;
        }

        .forgot-password:hover::after {
            width: 100%;
        }

        .login-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.7s ease;
        }

        .login-button:hover {
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
        }

        .login-button:hover::before {
            left: 100%;
        }

        .register-link {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
        }

        .register-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .register-link a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: #38bdf8;
            transition: width 0.3s ease;
        }

        .register-link a:hover::after {
            width: 100%;
        }

        .count-particles {
            display: none; /* 隐藏粒子计数器 */
        }

        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 20px 10px;
            }
            
            .login-card {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    
    <div class="count-particles">
        <span class="js-count-particles"></span> 
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">S</div>
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Sign in to your account to continue</p>
            </div>
            <form>
                <div class="form-group">
                    <label for="username">Email Address</label>
                    <input type="email" id="username" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>
                <div class="remember-forgot">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                <button type="submit" class="login-button">Sign In</button>
                <div class="register-link">
                    Don't have an account yet? <a href="#">Create account</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://threejs.org/examples/js/libs/stats.min.js"></script>
    <script src="particles.js"></script>
    <script>
    // 优化粒子设置
    document.addEventListener('DOMContentLoaded', function() {
        if (window.pJSDom && window.pJSDom[0] && window.pJSDom[0].pJS) {
            const pJS = window.pJSDom[0].pJS;
            
            // 更改粒子颜色和连接线
            pJS.particles.color.value = "#dbeafe";
            pJS.particles.line_linked.color = "#93c5fd";
            pJS.particles.line_linked.opacity = 0.3;
            pJS.particles.move.speed = 3;  // 减慢移动速度
            
            // 刷新粒子系统
            pJS.fn.particlesRefresh();
        }
    });
    </script>
</body>
</html>
